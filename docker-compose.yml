# Phase 0: only PostgreSQL with pgvector. Provider services, the MCP server,
# webhook delivery and tracing are added in later phases.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aintegrator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aintegrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aintegrator}
      POSTGRES_DB: ${POSTGRES_DB:-aintegrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aintegrator} -d ${POSTGRES_DB:-aintegrator}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
