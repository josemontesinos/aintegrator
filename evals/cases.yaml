# Deterministic eval cassettes for phase 5.
# All data is fictional. `{{ ... }}` binds shared fragments (address/customer)
# or values from the last tool result; no network or API key is needed.
version: 1

address: &address
  street: "Fictional Street"
  number: "12"
  postal_code: "28001"
  city: "Madrid"
  country: "ES"

customer: &customer
  name: "Ada Example"
  email: "ada@example.invalid"

cases:
  - id: eligibility-basic
    task: "Check connectivity availability at Fictional Street 12, Madrid."
    tags: [eligibility, read-only]
    cassette:
      - tool_calls:
          - name: check_eligibility
            arguments: "{{ address }}"
      - text: "Fictional Street 12 has offers from fibernet, legacytel and skylink."
    expect:
      tools: [check_eligibility]
      answer_contains: [fibernet, legacytel, skylink]
      state:
        orders: 0
        audit_tools: [check_eligibility]

  - id: eligibility-skylink-offer
    task: "Do any providers cover Fictional Street 12 in Madrid?"
    tags: [eligibility]
    cassette:
      - tool_calls:
          - name: check_eligibility
            arguments: "{{ address }}"
      - text: "Yes, skylink and two other fictional providers have offers there."
    expect:
      tools: [check_eligibility]
      answer_contains: [skylink]
      state:
        orders: 0

  - id: eligibility-no-offers
    task: "Check availability at Fictional Street 12, Madrid."
    tags: [eligibility, fault]
    setup:
      scenario: no_offers
    cassette:
      - tool_calls:
          - name: check_eligibility
            arguments: "{{ address }}"
      - text: "There are no offers available at this fictional address right now."
    expect:
      tools: [check_eligibility]
      answer_contains: ["no offers"]
      state:
        orders: 0

  - id: eligibility-partial-outage
    task: "Check availability at Fictional Street 12, Madrid."
    tags: [eligibility, fault, recovery]
    setup:
      scenario: unavailable
    cassette:
      - tool_calls:
          - name: check_eligibility
            arguments: "{{ address }}"
      - text: "fibernet and skylink are available; legacytel is unavailable during maintenance."
    expect:
      tools: [check_eligibility]
      answer_contains: [unavailable]
      state:
        orders: 0

  - id: order-create-fibernet
    task: "Place an order with fibernet at Fictional Street 12, Madrid."
    tags: [order, write, approval]
    cassette:
      - tool_calls:
          - name: check_eligibility
            arguments: "{{ address }}"
      - tool_calls:
          - name: create_order
            arguments:
              <<: *address
              provider: fibernet
              offer_id: "{{ providers[0].offers[0].offer_id }}"
              customer_name: "{{ customer.name }}"
              customer_email: "{{ customer.email }}"
              idempotency_key: "eval-create-fibernet"
              client_reference: "eval-create-fibernet"
      - text: "The fibernet order was submitted after approval."
    expect:
      tools: [check_eligibility, create_order]
      answer_contains: [submitted]
      approvals_consumed: 1
      state:
        orders: 1
        status: SUBMITTED
        provider: fibernet
        approved_writes: 1

