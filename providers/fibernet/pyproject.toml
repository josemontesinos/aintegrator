[project]
name = "aintegrator-fibernet"
version = "0.1.0"
description = "Simulated provider A: FastAPI REST/JSON"
requires-python = ">=3.12"
dependencies = [
    "aintegrator-provider-common",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_fibernet"]

[tool.uv.sources]
aintegrator-provider-common = { workspace = true }
