[project]
name = "aintegrator-legacytel"
version = "0.1.0"
description = "Simulated provider B: Flask SOAP 1.1/XML"
requires-python = ">=3.12"
dependencies = [
    "aintegrator-provider-common",
    "flask>=3.0",
    "lxml>=5.2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_legacytel"]

[tool.uv.sources]
aintegrator-provider-common = { workspace = true }
