[project]
name = "aintegrator-provider-common"
version = "0.1.0"
description = "Framework-independent fault injection primitives shared by simulated providers"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_provider_common"]
