[project]
name = "aintegrator-skylink"
version = "0.1.0"
description = "Simulated provider C: Django + DRF with webhooks"
requires-python = ">=3.12"
dependencies = [
    "aintegrator-provider-common",
    "django>=5.1",
    "djangorestframework>=3.15",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_skylink"]

[tool.uv.sources]
aintegrator-provider-common = { workspace = true }
