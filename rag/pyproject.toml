[project]
name = "aintegrator-rag"
version = "0.1.0"
description = "Hybrid retrieval over fictional provider documentation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_rag"]

# sentence-transformers and pgvector are added in phase 6 to keep phase 0 lean.
