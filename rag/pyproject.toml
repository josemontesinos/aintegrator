[project]
name = "aintegrator-rag"
version = "0.6.0"
description = "Hybrid retrieval over fictional provider documentation"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy local embedding model; CI and offline evals use the built-in hash embedder.
local = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aintegrator_rag"]
